version: '3.8'

networks:
  wms-distributed-net:
    driver: bridge

volumes:
  vol_central_primary:
  vol_central_replica:
  vol_hn_primary:
  vol_hn_replica:
  vol_hcm_primary:
  vol_hcm_replica:

services:
  # =========================================================================
  # MESSAGE BROKER: APACHE KAFKA (KRaft mode - Đồng bộ sự kiện & định kỳ)
  # =========================================================================
  kafka:
    image: apache/kafka:latest
    container_name: wms_kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - wms-distributed-net

  # =========================================================================
  # SITE 1: TRỤ SỞ CHÍNH - BÁO CÁO TỔNG HỢP & DANH MỤC DÙNG CHUNG
  # =========================================================================

  # Database Cluster Trung Tâm: DB Primary
  db_central_primary:
    image: postgres:16-alpine
    container_name: db_central_primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_central_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5431:5432"
    volumes:
      - vol_central_primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 4s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - wms-distributed-net

  # Database Cluster Trung Tâm: DB Replica (Dự phòng)
  db_central_replica:
    image: postgres:16-alpine
    container_name: db_central_replica
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_central_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "6431:5432"
    volumes:
      - vol_central_replica:/var/lib/postgresql/data
    networks:
      - wms-distributed-net

  # Central API 1
  central_app_1:
    image: wms_backend_node:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: central_app_1
    restart: always
    environment:
      PORT: 5000
      SITE_ID: SITE_CENTRAL
      SITE_NAME: "Trụ sở chính - Báo cáo tổng hợp"
      NODE_ID: central_app_1
      LB_PORT: 8000
      DATABASE_URL: "postgresql://postgres:postgres@db_central_primary:5432/wms_central_db?schema=public"
      JWT_SECRET: super_secret_jwt_key_wms_team8_2026
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "5001:5000"
    depends_on:
      db_central_primary:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wms-distributed-net

  # Central API 2
  central_app_2:
    image: wms_backend_node:latest
    container_name: central_app_2
    restart: always
    environment:
      PORT: 5000
      SITE_ID: SITE_CENTRAL
      SITE_NAME: "Trụ sở chính - Báo cáo tổng hợp"
      NODE_ID: central_app_2
      LB_PORT: 8000
      DATABASE_URL: "postgresql://postgres:postgres@db_central_primary:5432/wms_central_db?schema=public"
      JWT_SECRET: super_secret_jwt_key_wms_team8_2026
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "5002:5000"
    depends_on:
      db_central_primary:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wms-distributed-net

  # Load Balancer Site 1 (Nginx cổng 8000)
  lb_central:
    image: nginx:alpine
    container_name: lb_central
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./distributed/nginx/site1_central.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - central_app_1
      - central_app_2
    networks:
      - wms-distributed-net

  # =========================================================================
  # SITE 2: KHO MIỀN BẮC - NODE HN
  # =========================================================================

  # Database Cluster HN: DB Primary (Phân mảnh TON_KHO_HN)
  db_hn_primary:
    image: postgres:16-alpine
    container_name: db_hn_primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_hn_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - vol_hn_primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 4s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - wms-distributed-net

  # Database Cluster HN: DB Replica (Dự phòng)
  db_hn_replica:
    image: postgres:16-alpine
    container_name: db_hn_replica
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_hn_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "6432:5432"
    volumes:
      - vol_hn_replica:/var/lib/postgresql/data
    networks:
      - wms-distributed-net

  # Local App 1 HN
  hn_app_1:
    image: wms_backend_node:latest
    container_name: hn_app_1
    restart: always
    environment:
      PORT: 5000
      SITE_ID: SITE_HN
      SITE_NAME: "Kho miền Bắc - Node HN"
      NODE_ID: hn_app_1
      LB_PORT: 8001
      DATABASE_URL: "postgresql://postgres:postgres@db_hn_primary:5432/wms_hn_db?schema=public"
      JWT_SECRET: super_secret_jwt_key_wms_team8_2026
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "5003:5000"
    depends_on:
      db_hn_primary:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wms-distributed-net

  # Local App 2 HN
  hn_app_2:
    image: wms_backend_node:latest
    container_name: hn_app_2
    restart: always
    environment:
      PORT: 5000
      SITE_ID: SITE_HN
      SITE_NAME: "Kho miền Bắc - Node HN"
      NODE_ID: hn_app_2
      LB_PORT: 8001
      DATABASE_URL: "postgresql://postgres:postgres@db_hn_primary:5432/wms_hn_db?schema=public"
      JWT_SECRET: super_secret_jwt_key_wms_team8_2026
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "5004:5000"
    depends_on:
      db_hn_primary:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wms-distributed-net

  # Load Balancer Site 2 (Nginx cổng 8001)
  lb_hn:
    image: nginx:alpine
    container_name: lb_hn
    restart: always
    ports:
      - "8001:80"
    volumes:
      - ./distributed/nginx/site2_hn.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hn_app_1
      - hn_app_2
    networks:
      - wms-distributed-net

  # =========================================================================
  # SITE 3: KHO MIỀN NAM - NODE HCM
  # =========================================================================

  # Database Cluster HCM: DB Primary (Phân mảnh TON_KHO_HCM)
  db_hcm_primary:
    image: postgres:16-alpine
    container_name: db_hcm_primary
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_hcm_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5434:5432"
    volumes:
      - vol_hcm_primary:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 4s
      timeout: 5s
      retries: 15
      start_period: 10s
    networks:
      - wms-distributed-net

  # Database Cluster HCM: DB Replica (Dự phòng)
  db_hcm_replica:
    image: postgres:16-alpine
    container_name: db_hcm_replica
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_hcm_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "6433:5432"
    volumes:
      - vol_hcm_replica:/var/lib/postgresql/data
    networks:
      - wms-distributed-net

  # Local App 1 HCM
  hcm_app_1:
    image: wms_backend_node:latest
    container_name: hcm_app_1
    restart: always
    environment:
      PORT: 5000
      SITE_ID: SITE_HCM
      SITE_NAME: "Kho miền Nam - Node HCM"
      NODE_ID: hcm_app_1
      LB_PORT: 8002
      DATABASE_URL: "postgresql://postgres:postgres@db_hcm_primary:5432/wms_hcm_db?schema=public"
      JWT_SECRET: super_secret_jwt_key_wms_team8_2026
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "5005:5000"
    depends_on:
      db_hcm_primary:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wms-distributed-net

  # Local App 2 HCM
  hcm_app_2:
    image: wms_backend_node:latest
    container_name: hcm_app_2
    restart: always
    environment:
      PORT: 5000
      SITE_ID: SITE_HCM
      SITE_NAME: "Kho miền Nam - Node HCM"
      NODE_ID: hcm_app_2
      LB_PORT: 8002
      DATABASE_URL: "postgresql://postgres:postgres@db_hcm_primary:5432/wms_hcm_db?schema=public"
      JWT_SECRET: super_secret_jwt_key_wms_team8_2026
      KAFKA_BROKERS: "kafka:9092"
    ports:
      - "5006:5000"
    depends_on:
      db_hcm_primary:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wms-distributed-net

  # Load Balancer Site 3 (Nginx cổng 8002)
  lb_hcm:
    image: nginx:alpine
    container_name: lb_hcm
    restart: always
    ports:
      - "8002:80"
    volumes:
      - ./distributed/nginx/site3_hcm.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hcm_app_1
      - hcm_app_2
    networks:
      - wms-distributed-net

  # =========================================================================
  # DỊCH VỤ ĐỒNG BỘ LIÊN SITE QUA KAFKA (CROSS-SITE SYNC WORKER)
  # =========================================================================
  sync_service:
    build:
      context: ./distributed/sync-service
      dockerfile: Dockerfile
    container_name: wms_sync_service
    restart: always
    environment:
      PORT: 5055
      SYNC_INTERVAL_SEC: 30
      KAFKA_BROKERS: "kafka:9092"
      CENTRAL_LB_URL: "http://lb_central"
      HN_LB_URL: "http://lb_hn"
      HCM_LB_URL: "http://lb_hcm"
    ports:
      - "5055:5055"
    depends_on:
      - kafka
      - lb_central
      - lb_hn
      - lb_hcm
    networks:
      - wms-distributed-net
