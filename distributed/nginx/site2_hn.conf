# Nginx Load Balancer cho Site 2: Kho miền Bắc - Node HN
events { worker_connections 1024; }

http {
    upstream hn_backend_cluster {
        # Thuật toán Round-Robin cân bằng tải giữa 2 App instance
        server hn_app_1:5000 max_fails=3 fail_timeout=10s;
        server hn_app_2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://hn_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header định danh Load Balancer phục vụ
            add_header X-Load-Balancer "LB-Site2-North-HN" always;
        }
    }
}
