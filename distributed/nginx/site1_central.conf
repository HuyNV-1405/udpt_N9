# Nginx Load Balancer cho Site 1: Trụ sở chính - Báo cáo tổng hợp
events { worker_connections 1024; }

http {
    upstream central_backend_cluster {
        # Thuật toán Round-Robin cân bằng tải giữa 2 App instance
        server central_app_1:5000 max_fails=3 fail_timeout=10s;
        server central_app_2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://central_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header định danh Load Balancer phục vụ
            add_header X-Load-Balancer "LB-Site1-Central-Headquarters" always;
        }
    }
}
