# Nginx Load Balancer cho Site 3: Kho miền Nam - Node HCM
events { worker_connections 1024; }

http {
    upstream hcm_backend_cluster {
        # Thuật toán Round-Robin cân bằng tải giữa 2 App instance
        server hcm_app_1:5000 max_fails=3 fail_timeout=10s;
        server hcm_app_2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://hcm_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Header định danh Load Balancer phục vụ
            add_header X-Load-Balancer "LB-Site3-South-HCM" always;
        }
    }
}
