version: '3.8'

services:
  # ========================================================
  # PostgreSQL 16 Database Service
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: wms_postgres_n8
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wms_db}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Bắt buộc mount volume để dữ liệu không bị mất khi xóa/tái tạo container
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wms_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wms-network

  # ========================================================
  # (Tùy chọn) pgAdmin 4 - Giao diện Web trực quan quản lý DB
  # Truy cập: http://localhost:5051 (Email: admin@wms.com / Pass: admin)
  # ========================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wms_pgadmin_n8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wms.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wms-network

networks:
  wms-network:
    driver: bridge
